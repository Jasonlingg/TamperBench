# Small Muon pilot; use a compatible BF16 CUDA GPU for realistic experiments.
# These values are starting points, not validated research hyperparameters.
base:
    model_config:
        template: plain
        max_generation_length: 1024
        inference_batch_size: 16
    evals: [strong_reject, mmlu_pro_val]
    per_device_train_batch_size: 1
    gradient_accumulation_steps: 1
    learning_rate: 0.00001
    adamw_learning_rate: null
    weight_decay: 0.0
    num_train_epochs: 1
    lr_scheduler_type: constant
    optim: muon
    muon_momentum: 0.95
    muon_nesterov: true
    muon_ns_steps: 5
    muon_adjust_lr_fn: match_rms_adamw
    max_steps: 2
    dataset_size: 8
    poison_ratio: 1.0
    harmful_dataset: safe_rlhf_alpaca_train
    benign_dataset: bookcorpus
